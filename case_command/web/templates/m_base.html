<!doctype html>
<html lang="en" data-online="yes">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Case Command">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/mobile.css">
  <title>{% block title %}Case Command{% endblock %}</title>
</head>
<body class="m">

<header class="m-top">
  {% if back %}<a class="back" href="{{ back }}" aria-label="Back">&#8249;</a>{% endif %}
  <h1>{% block heading %}{{ self.title() }}{% endblock %}</h1>
  <span class="conn on" data-conn>Online</span>
</header>

<main class="m-wrap">
{% block content %}{% endblock %}
</main>

<nav class="m-tabs">
  <a href="/m" class="{{ 'on' if tab == 'home' }}"><span class="ico">◧</span>Home</a>
  <a href="/m/offline" class="{{ 'on' if tab == 'offline' }}"><span class="ico">⬇</span>Offline</a>
  <a href="/m/capture" class="{{ 'on' if tab == 'capture' }}"><span class="ico">◉</span>Capture</a>
  <a href="/m/deadlines" class="{{ 'on' if tab == 'deadlines' }}"><span class="ico">⏱</span>Dates</a>
  <a href="/m/hearing" class="{{ 'on' if tab == 'hearing' }}"><span class="ico">⚖</span>Hearing</a>
</nav>

<script src="/static/app.js"></script>
</body>
</html>
